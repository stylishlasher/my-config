# ╔══════════════════════════════════════════╗
# ║   MangoWC — config.conf                  ║
# ║   Формат: ключ=значение (без пробелов)   ║
# ║   Настройки: Super+S (повторно — закрыть) · Обои: Super+W            ║
# ╚══════════════════════════════════════════╝

# ── Автозапуск ──────────────────────────────
exec_once=~/.config/mango/scripts/autostart.sh

# Монитор: eDP-2, 1920x1200 @ 180 Гц
monitor_rule=name:^eDP-2$,width:1920,height:1200,refresh:180,x:0,y:0,scale:1

# ── Окружение ───────────────────────────────
env=XCURSOR_SIZE,24
cursor_size=24
env=QT_QPA_PLATFORM,wayland
env=MOZ_ENABLE_WAYLAND,1
env=GTK_THEME,Adwaita:dark

# ── Внешний вид ─────────────────────────────
# Цвета ниже — базовые; при включённом Matugen акцент/фокус обновляются из обоев (Super+S → Обои → Matugen).
border_px=2
border_radius=14
no_radius_when_single=0
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=10
gap_outer_vertical=10
smart_gaps=0

root_color=0x1e1e2eff
border_color=0x45475aff
focus_color=0xcba6f7ff
urgent_color=0xf38ba8ff
maximized_screen_color=0xa6e3a1ff
scratchpad_color=0x89b4faff
global_color=0xf5c2e7ff
overlay_color=0x94e2d5ff

focused_opacity=1.0
unfocused_opacity=0.90

# ── Блюр (для стекла) ───────────────────────
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=7
blur_params_noise=0.015
blur_params_brightness=0.92
blur_params_contrast=0.92
blur_params_saturation=1.15

# ── Тени ────────────────────────────────────
shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=16
shadows_position_x=0
shadows_position_y=3
shadows_color=0x00000099

# ── Анимации (пресет Smooth; менять: Super+S → Эффекты → Анимации) ──
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.8
zoom_end_ratio=0.8
fade_in_begin_opacity=0.4
fade_out_begin_opacity=0.8
animation_duration_move=320
animation_duration_open=320
animation_duration_tag=320
animation_duration_close=260
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_close=0.4,0,0.2,1

# ── Тайлинг ─────────────────────────────────
new_is_master=0
default_master_factor=0.55
default_master_count=1

# Scroller-раскладка (прокручиваемый/«бесконечный» режим, Super+Shift+0)
# Параметры зависят от версии MangoWC; неподдерживаемые ключи обычно игнорируются.
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_prefer_overspread=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.75,1.0

# Обзор (Super+0): параметры зависят от версии MangoWC
hotarea_size=10
enable_hotarea=1

# ── Поведение ───────────────────────────────
sloppy_focus=1
warp_cursor=1
focus_on_activate=1
enable_floating_snap=1
snap_distance=28
cursor_hide_timeout=4

# ── Клавиатура ──────────────────────────────
repeat_rate=32
repeat_delay=280
numlock_on=1
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle

# ── Тачпад ──────────────────────────────────
tap_to_click=1
tap_and_drag=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=0

# ── Правила окон ────────────────────────────
window_rule=is_floating:1,app_id:mango-settings
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:org.pulseaudio.pavucontrol
window_rule=is_floating:1,app_id:mango-nmtui

window_rule=is_floating:1,app_id:org.gnome.Calculator
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,title:Picture-in-Picture
window_rule=is_floating:1,app_id:org.kde.polkit-kde-authentication-agent-1

# Слой выделения slurp (скриншоты): без блюра и анимации, иначе мусор в кадре
layer_rule=no_blur:1,no_animation:1,layer_name:selection

# ══════════════════ БИНДЫ ══════════════════

# Приложения
bind=SUPER,Return,spawn_shell,~/.config/mango/scripts/launch terminal
bind=SUPER,f,spawn_shell,~/.config/mango/scripts/launch browser
bind=SUPER,e,spawn_shell,~/.config/mango/scripts/launch files
bind=SUPER,s,spawn_shell,~/.config/mango/scripts/launch settings
bind=SUPER,d,spawn,fuzzel
bind=SUPER,b,spawn_shell,~/.config/mango/scripts/power-menu
bind=SUPER,c,spawn_shell,~/.config/mango/scripts/clipboard
bind=SUPER+SHIFT,c,spawn_shell,~/.config/mango/scripts/clipboard clear
bind=SUPER,w,spawn_shell,~/.config/mango/scripts/wallpaper-pick
bind=SUPER+SHIFT,w,spawn_shell,~/.config/mango/scripts/wallpaper random
bind=SUPER+SHIFT,d,spawn_shell,~/.config/mango/scripts/dock toggle  # док: показать/скрыть

# Окна
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER,m,togglefullscreen,

# Фокус: Super + стрелки
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Поменять окна: Super+Shift + стрелки
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Размер: Super+Ctrl + стрелки
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50

# Положение floating: Super+Ctrl+Shift + стрелки
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50

# Рабочие столы / обзор / прокручиваемый (scroller) режим
# Super+1..9 — перейти на рабочий стол
# Super+Shift+1..9 — переместить активное окно на рабочий стол
# Super+0 — обзор окон (overview)
# Super+` — переключить scroller/tile (прокручиваемый/«бесконечный» режим туда-обратно)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,toggleoverview,
bind=SUPER,grave,spawn_shell,~/.config/mango/scripts/toggle-scroller  # переключить scroller/tile
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Система
bind=SUPER+SHIFT,r,reload_config,
bind=SUPER+SHIFT,b,spawn_shell,pkill -SIGUSR1 waybar  # показать/скрыть панель
bind=NONE,Print,spawn_shell,~/.config/mango/scripts/screenshot
bind=SHIFT,Print,spawn_shell,~/.config/mango/scripts/screenshot full
bind=SUPER,Print,spawn_shell,~/.config/mango/scripts/screenshot edit  # область → открыть в satty
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn_shell,playerctl play-pause
bind=NONE,XF86AudioNext,spawn_shell,playerctl next
bind=NONE,XF86AudioPrev,spawn_shell,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl set 5%-



# Мышь
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
