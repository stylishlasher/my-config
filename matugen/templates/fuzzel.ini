[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="❯ "
width=42
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8
icons-enabled=yes

[colors]
background={{colors.surface.default.hex_stripped}}ee
text={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}ff
selection-text={{colors.surface.default.hex_stripped}}ff
selection-match={{colors.surface.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff

[border]
width=2
radius=14
